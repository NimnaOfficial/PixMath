[project]
name = "pixmath-cli"
version = "0.1.0"
description = "PixMath terminal client: render equations, extract formulas, and studio preview"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "Pillow>=10.4",
    "numpy>=1.26,<3",
    "pixmath-core",
]

[project.scripts]
pixmath = "pixmath_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixmath_cli"]
