[project]
name = "pixmath-core"
version = "0.1.0"
description = "Shared math primitives: SDF shapes, Simplex noise, PSNR/SSIM metrics, CPU evaluator"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
metrics = ["scikit-image>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixmath_core"]
