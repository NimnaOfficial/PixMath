[project]
name = "pixmath-forward-worker"
version = "0.1.0"
description = "Forward engine worker: AST validation, AST-to-GLSL transpilation, headless ModernGL rendering"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10.4",
    "moderngl>=5.11",
    "aio-pika>=9.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pixmath-core",
]

[project.optional-dependencies]
gpu = ["moderngl-window>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
