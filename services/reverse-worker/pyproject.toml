[project]
name = "pixmath-reverse-worker"
version = "0.1.0"
description = "Reverse engine worker: SIREN/KAN neural implicit representation, PySR symbolic regression, Pareto selector"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.4",
    "Pillow>=10.4",
    "pysr>=1.0",
    "sympy>=1.13",
    "aio-pika>=9.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pixmath-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
